<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ManageVet{% endblock %}</title>
  <style>
    :root { --ink: #1f2933; --muted: #616e7c; --line: #e4e7eb; --accent: #1f6f8b; --ok: #2f855a; --bad: #c0392b; --bg-soft: #f5f7fa; }
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 1rem; color: var(--ink); background: #fff; }
    table { border-collapse: collapse; margin: .5rem 0 1rem; }
    th, td { padding: .3rem .6rem; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; }
    th:first-child, td:first-child { text-align: left; }
    .map { display: grid; gap: 1px; background: #cbd2d9; width: fit-content; }
    .cell { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
    .clinic { background: var(--bad) !important; color: #fff; border-radius: 50%; text-decoration: none; }
    .clinic.mine { background: var(--accent) !important; }
    .neg { color: var(--bad); }
    .pos { color: var(--ok); }
    .muted { color: var(--muted); font-size: .9em; }
    td.left { text-align: left; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: .5rem; margin-bottom: 1rem; }
    nav .spacer { flex: 1; }
    nav form { display: inline; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: .5rem .8rem; border-radius: 4px; margin-bottom: .4rem; background: var(--bg-soft); border-left: 4px solid var(--accent); }
    .messages li.success { border-color: var(--ok); }
    .messages li.error { border-color: var(--bad); }
    section.card { border: 1px solid var(--line); border-radius: 6px; padding: .5rem 1rem 1rem; margin-bottom: 1.2rem; }
    section.card h2 { margin-top: .5rem; font-size: 1.15rem; }
    input[type=number] { width: 7rem; text-align: right; }
    input, select, button { font: inherit; padding: .2rem .4rem; }
    button, a.button { cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; }
    a.button { display: inline-block; padding: .3rem .7rem; text-decoration: none; }
    button.secondary { background: #fff; color: var(--accent); }
    button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
    .errorlist { color: var(--bad); margin: 0; padding-left: 1rem; font-size: .85em; }
    .tag { font-size: .8em; padding: .1rem .4rem; border-radius: 3px; background: var(--bg-soft); color: var(--muted); }
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'game:server_list' %}">Parties</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administration</a>{% endif %}
    <span class="spacer"></span>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Déconnexion</button></form>
    {% endif %}
  </nav>
  {% if messages %}
  <ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
