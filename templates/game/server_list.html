{% extends "base.html" %}
{% block content %}
<h1>Parties</h1>
<ul>
{% for s in servers %}
  <li><a href="{% url 'game:server_map' s.pk %}">{{ s.name }}</a> — {{ s.get_status_display }}, trimestre {{ s.current_quarter }}/{{ s.total_quarters }}</li>
{% empty %}
  <li>Aucune partie. Lancez <code>python manage.py seed_demo</code>.</li>
{% endfor %}
</ul>
{% endblock %}
